name: Python

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Replace older PR runs; every main/manual run keeps its own group.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python ${{ matrix.python-version }} and Octave parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Configure reliable Ubuntu package downloads
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          fi
          if [ -f /etc/apt/apt-mirrors-security.txt ]; then
            printf '%s\n' 'https://security.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors-security.txt > /dev/null
          fi
          printf '%s\n' 'Acquire::Retries "2";' 'Acquire::http::Timeout "15";' 'Acquire::https::Timeout "15";' | sudo tee /etc/apt/apt.conf.d/80-torch-ci > /dev/null
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install numerical and GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y octave xvfb xauth python3-tk
          python -m pip install -r requirements.txt
      - name: Check Python PEP 8 style
        run: python -m pycodestyle python
      - name: Run Python numerical, GUI and cross-language tests
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python -m unittest discover -s python/tests -v
      - name: Verify independent analytic references
        run: python python/torchVerify.py --quick --out out/verification-python.json
      - name: Verify AMR advection and measure CPU execution
        if: matrix.python-version == '3.12'
        run: python python/torchAdaptiveStudy.py --quick --out out/adaptive-python.json
      - name: Record performance and allocation measurements
        if: matrix.python-version == '3.12'
        run: python python/torchBenchmark.py --quick --out out/benchmark-python.json
      - name: Run Octave 1D/2D/3D numerical tests
        if: matrix.python-version == '3.12'
        run: octave --no-gui --quiet --eval "run('matlab/tests/testMatlabSolver.m'); addpath('matlab/tests'); testMatlabSolver3D; testGeometry; testDesktopModel; testAdaptive; testPerformance; testVerification; report=torchVerify('quick',true,'output','out/verification-octave.json'); assert(report.passed);"
      - name: Preserve verification and performance reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-${{ matrix.python-version }}-reports
          path: out/*.json
          if-no-files-found: ignore
