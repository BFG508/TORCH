name: MATLAB

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matlab:
    name: MATLAB R2024a 1D/2D/3D and GUI tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python for checkpoint interoperability
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install independent readers and prepare checkpoint fixtures
        run: |
          python -m pip install -r requirements.txt
          python python/tests/checkCheckpointInterop.py prepare out/ci-interop
          python python/tests/checkGeometryInterop.py prepare out/ci-geometry
          python python/tests/checkDesktopInterop.py prepare out/ci-desktop
          python python/tests/checkAdaptiveInterop.py prepare out/ci-adaptive
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024a
          products: Parallel_Computing_Toolbox
      - name: Start virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth python3-tk
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp > "$RUNNER_TEMP/xvfb.log" 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
      - name: Run MATLAB numerical and GUI tests
        uses: matlab-actions/run-command@v3
        with:
          command: run('matlab/tests/testMatlabSolver.m'); addpath('matlab/tests'); testMatlabSolver3D; testMatlabGui; testSession; testCheckpointInterop('out/ci-interop'); testGeometry; testGeometryInterop('out/ci-geometry'); testDesktopModel; testDesktop; testDesktopInterop('out/ci-desktop'); testAdaptive; testParallel; testAdaptiveDesktop; testAdaptiveInterop('out/ci-adaptive'); testPerformance; testVerification; report=torchVerify('quick',true); assert(report.passed); torchBenchmark('quick',true); torchAdaptiveStudy('quick',true,'workers',[1,2]);
      - name: Verify MATLAB checkpoints and exports with Python readers
        run: |
          python python/tests/checkCheckpointInterop.py verify out/ci-interop
          python python/tests/checkGeometryInterop.py verify out/ci-geometry
          python python/tests/checkDesktopInterop.py verify out/ci-desktop
          python python/tests/checkAdaptiveInterop.py verify out/ci-adaptive
      - name: Preserve verification and performance reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: matlab-reports
          path: out/*.json
          if-no-files-found: ignore
