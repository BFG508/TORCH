name: MATLAB

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matlab:
    name: MATLAB R2024a 1D/2D/3D and GUI tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024a
      - name: Start virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp > "$RUNNER_TEMP/xvfb.log" 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
      - name: Run MATLAB numerical and GUI tests
        uses: matlab-actions/run-command@v3
        with:
          command: run('matlab/tests/testMatlabSolver.m'); addpath('matlab/tests'); testMatlabSolver3D; testMatlabGui;
